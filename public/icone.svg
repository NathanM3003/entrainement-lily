<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f4b"/>
      <stop offset="0.55" stop-color="#14213a"/>
      <stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
    <radialGradient id="lueur" cx="0.74" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#ff7d57" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7d57" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eclair" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd23f" stop-opacity="0.15"/>
      <stop offset="0.45" stop-color="#ffb52e"/>
      <stop offset="1" stop-color="#ff5a2c"/>
    </linearGradient>
    <linearGradient id="disque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe2d6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#ciel)"/>
  <rect width="512" height="512" rx="112" fill="url(#lueur)"/>
  <!-- Traînées de vitesse -->
  <g stroke-linecap="round" fill="none">
    <path d="M70 330 L190 300" stroke="#ffffff" stroke-opacity="0.18" stroke-width="10"/>
    <path d="M96 392 L236 352" stroke="#ffffff" stroke-opacity="0.12" stroke-width="8"/>
    <path d="M60 262 L150 244" stroke="#ffffff" stroke-opacity="0.1" stroke-width="6"/>
  </g>
  <!-- Éclair : la trajectoire du disque -->
  <path d="M92 448 L214 290 L170 284 L300 150 L268 232 L322 236 L232 340 Z" fill="url(#eclair)"/>
  <!-- Disque en vol, incliné -->
  <g transform="translate(362 150) rotate(-22)">
    <ellipse cx="0" cy="16" rx="104" ry="34" fill="#c2361d"/>
    <ellipse cx="0" cy="8" rx="104" ry="34" fill="#ff5a2c"/>
    <ellipse cx="0" cy="4" rx="70" ry="20" fill="none" stroke="url(#disque)" stroke-opacity="0.85" stroke-width="7"/>
    <ellipse cx="-36" cy="-6" rx="22" ry="6" fill="#ffffff" fill-opacity="0.45"/>
  </g>
</svg>
